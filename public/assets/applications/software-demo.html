<!doctype html><html lang="id"><meta charset="utf-8"><title>Demonstrasi komputasi vektor</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#eef2f7;color:#21314a;font:20px system-ui}header{padding:20px 28px;background:#19283e;color:white;font-weight:650}main{padding:24px}h1{font-size:28px;margin:0 0 15px}canvas{background:white;border:1px solid #ccd5e2;border-radius:8px;width:100%;height:390px}pre{background:#19283e;color:#d3e9ff;padding:20px;border-radius:8px;font:21px/1.5 monospace;margin:16px 0}label{display:flex;gap:15px;align-items:center;font-size:16px}input{flex:1}</style><header>LAB VEKTOR / DEMONSTRASI PERANGKAT LUNAK</header><main><h1></h1><canvas width="850" height="390"></canvas><pre></pre><label>Parameter simulasi <input type="range" min="0" max="100" value="50"></label></main><script>
const mode=new URLSearchParams(location.search).get('mode')||'light',c=document.querySelector('canvas'),g=c.getContext('2d'),out=document.querySelector('pre');
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),norm=a=>Math.sqrt(dot(a,a));
const names={light:'Renderer: pencahayaan permukaan',search:'Pencarian: peringkat kemiripan dokumen',vision:'Game: pemeriksaan bidang pandang NPC',distance:'Game: jarak pemain ke objek',speed:'Simulasi: besar kecepatan gerak',error:'Optimisasi: besar galat prediksi'};
document.querySelector('h1').textContent=names[mode];
function text(t,x,y,color='#21314a'){g.fillStyle=color;g.font='22px system-ui';g.fillText(t,x,y)}
function line(x,y,X,Y,color='#315bdb',width=4){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function ball(x,y,r,color){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=color;g.fill()}
function draw(){const t=+document.querySelector('input').value/100;g.clearRect(0,0,850,390);
if(mode==='light'){const l=[-.6+t*.4,-.6, .8];const L=l.map(x=>x/norm(l)),im=g.createImageData(850,390);for(let y=0;y<390;y++)for(let x=0;x<850;x++){const X=(x-350)/155,Y=(y-195)/155,z=1-X*X-Y*Y;if(z<0)continue;const q=.14+.86*Math.max(0,dot([X,Y,Math.sqrt(z)],L)),i=(y*850+x)*4;im.data[i]=45*q;im.data[i+1]=105*q;im.data[i+2]=240*q;im.data[i+3]=255;}g.putImageData(im,0,0);text('Cahaya',605,75);line(650,95,490,150,'#da9f17');text('n · l',600,260);out.textContent='intensitas = max(0, dot(normal, arahCahaya))'+'\nNormal dan arah cahaya: vektor satuan';}
if(mode==='search'){const query=[1,t+.5,0],docs=[[1,1,0],[1,0,1],[0,0,1]],labels=['Dasar pemrograman','Basis data','Fotografi'];docs.map((v,i)=>({i,score:dot(query,v)/(norm(query)*norm(v))})).sort((a,b)=>b.score-a.score).forEach((o,j)=>{const y=80+j*110;text(labels[o.i],30,y);g.fillStyle='#315bdb';g.fillRect(290,y-26,400*o.score,38);text(o.score.toFixed(3),715,y)});out.textContent='skor = dot(q, d) / (norm(q) × norm(d))\nPeringkat dihitung dari vektor fitur dokumen';}
if(mode==='vision'){const angle=(t-.5)*2,dir=[Math.cos(angle),Math.sin(angle)],score=dot([1,0],dir),visible=score>=Math.cos(Math.PI/4);g.beginPath();g.moveTo(180,200);g.arc(180,200,280,-Math.PI/4,Math.PI/4);g.closePath();g.fillStyle='#e5edff';g.fill();ball(180,200,20,'#315bdb');const x=180+260*dir[0],y=200+260*dir[1];ball(x,y,18,visible?'#188751':'#cf3644');line(180,200,440,200);text('NPC',130,245);text('Target',x+25,y);out.textContent='dot(arahDepan, arahTarget) = '+score.toFixed(3)+'\nTarget '+(visible?'di dalam':'di luar')+' bidang pandang ±45°';}
if(mode==='distance'||mode==='speed'){for(let x=50;x<850;x+=50)line(x,20,x,360,'#e5eaf1',1);for(let y=30;y<390;y+=50)line(30,y,820,y,'#e5eaf1',1);const a=[3,4],n=norm(a);line(220,300,370,100,'#315bdb',5);ball(220,300,14,'#315bdb');ball(370,100,14,'#d13d4f');line(220,300,370,300,'#a7b3c7',2);line(370,300,370,100,'#a7b3c7',2);text('3',285,330);text('4',390,210);text('5',265,190);text(mode==='distance'?'Pemain':'v = (3,4)',70,290);text(mode==='distance'?'Objek':'Kecepatan',390,95);out.textContent=mode==='distance'?'jarak = norm(posisiObjek − posisiPemain)\n√(3² + 4²) = '+n+' m':'kelajuan = norm(vektorKecepatan)\n√(3² + 4²) = '+n+' m/s';}
if(mode==='error'){const y=[2,4,6],pred=[3,3,8],e=pred.map((x,i)=>x-y[i]);line(100,320,780,320,'#8090a5',2);line(100,320,100,30,'#8090a5',2);for(let i=0;i<3;i++){const x=220+i*220;line(x,320-y[i]*32,x,320-pred[i]*32,'#d13d4f',7);ball(x,320-y[i]*32,10,'#315bdb');ball(x,320-pred[i]*32,10,'#188751');text('Data '+(i+1),x-35,355)}text('● Aktual',135,35,'#315bdb');text('● Prediksi',320,35,'#188751');out.textContent='galat = prediksi − aktual = (1, −1, 2)\nnorm(galat) = √6 = '+norm(e).toFixed(3);}}
if(['distance','speed','error'].includes(mode))document.querySelector('label').hidden=true;document.querySelector('input').oninput=draw;draw();
</script></html>
